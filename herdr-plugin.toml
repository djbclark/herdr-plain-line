id = "local.plain-line"
name = "Plain English line"
version = "0.1.0"
min_herdr_version = "0.7.0"
description = "A popup line for renaming the current tab or workspace, or creating a workspace. No model calls."
platforms = ["linux", "macos", "windows"]

[[actions]]
id = "open"
title = "Plain English line"
contexts = ["global", "workspace", "tab", "pane"]
command = ["python3", "line.py", "--open"]

[[panes]]
id = "line"
title = "Plain English"
placement = "popup"
width = "70%"
height = 8
command = ["python3", "line.py"]
